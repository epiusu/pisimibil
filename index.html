<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pisi Linux</title>
  <link rel="icon" href="../logo.png">
  <!-- Font Awesome Free CDN -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header>
    <img src="../logo.png" alt="Pisi Linux Logo" class="logo">
    <h1 data-i18n="title">Pisi Linux</h1>
    <div class="lang-switch">
      <button data-lang="tr"><i class="fa-solid fa-language"></i> TR</button>
      <button data-lang="en"><i class="fa-solid fa-language"></i> EN</button>
    </div>
  </header>

  <main>
    <p class="subtitle" data-i18n="about">Türkiye'den dünyaya açık kaynak dağıtım</p>

    <section>
      <h2 data-i18n="features_title"><i class="fa-solid fa-star"></i> <span data-i18n="features_title_text">Temel Özellikler</span></h2>
      <ul>
        <li><i class="fa-solid fa-box-open"></i> <span data-i18n="feat1">PiSi Paket Yöneticisi</span></li>
        <li><i class="fa-solid fa-shield-halved"></i> <span data-i18n="feat2">Güvenli & Güncel</span></li>
        <li><i class="fa-solid fa-globe"></i> <span data-i18n="feat3">Çoklu Dil Desteği</span></li>
        <li><i class="fa-solid fa-bolt"></i> <span data-i18n="feat4">Hafif & Esnek</span></li>
      </ul>
    </section>

    <section>
      <h2 data-i18n="links_title"><i class="fa-solid fa-link"></i> <span data-i18n="links_title_text">Bağlantılar</span></h2>
      <a href="https://docs.pisilinux.org"><i class="fa-solid fa-book"></i> <span data-i18n="link_docs">Dokümantasyon</span></a>
      <a href="https://github.com/pisilinux/pisi"><i class="fa-brands fa-github"></i> <span data-i18n="link_github">GitHub</span></a>
      <a href="https://pisilinux.org/indir"><i class="fa-solid fa-download"></i> <span data-i18n="link_download">İndir</span></a>
      <a href="https://matrix.to/#/!pisi-linux:matrix.org"><i class="fa-solid fa-comments"></i> <span data-i18n="link_community">Topluluk</span></a>
    </section>
  </main>

  <footer>
    <p><i class="fa-regular fa-copyright"></i> <span data-i18n="footer">2024 Pisi Linux | GPLv3 | Açık Kaynak & Özgür Yazılım</span></p>
  </footer>

  <script src="js/i18n.js"></script>
</body>
</html>
